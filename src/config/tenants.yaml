tenants:
  hsbc:
    company_name: "HSBC"
    greeting: "Hey there, I’m Eve, speaking from HSBC Talent Acquisition Team. How may I help you?"
    llm:
      model: "gpt-4.1"
      temperature: 0.1
    flows:
      default:
        enabled_agents: ["Applications", "Onboarding"]
    language:
      english:
        stt:
          provider: "deepgram"
          language_code: "en-US"
          endpointing_ms: 200
        tts:
          provider: "elevenlabs"
          model: "eleven_turbo_v2_5"
        accent:
          indian: "H8bdWZHK2OgZwTN7ponr"
          us: "xctasy8XvGp2cVO9HL9k"

  walmart:
    company_name: "Walmart"
    greeting: "Thank you for calling Walmart People Services, My name is Eve. How may I help you?"
    llm:
      model: "gpt-4.1"
      temperature: 0.1

    flows:
      default:
        enabled_agents: ["Applications", "Assessments", "Onboarding"]
      lite:
        enabled_agents: ["Assessments", "Onboarding"]
    language:
      english:
        stt:
          provider: "deepgram"
          language_code: "en-US"
          endpointing_ms: 200
        tts:
          provider: "elevenlabs"
          model: "eleven_turbo_v2_5"
        accent:
          indian: "H8bdWZHK2OgZwTN7ponr"
          us: "xctasy8XvGp2cVO9HL9k"

  translator:
    flows:
      hindi:
        target_voice: "H8bdWZHK2OgZwTN7ponr"
        placeholder: "Hindi"
        language_code: hi
        english_voice: "xctasy8XvGp2cVO9HL9k"            # for Deepgram/ElevenLabs

      spanish:
        target_voice: "tomkxGQGz4b1kE0EM722"
        placeholder: "Spanish"
        language_code: es 
        english_voice: "xctasy8XvGp2cVO9HL9k"   
  emaar:
    company_name: "Emaar (Dubai Mall)"
    greeting: "Hello! This is Sarah speaking from Dubai Mall Customer Support. Before we start, are you comfortable in English, or would you prefer speaking in Arabic or Chinese?"

    llm:
      model: "gpt-4.1"
      temperature: 0.1

    flows:
      default:
        enabled_agents: ["MallSupportAgent", "SurveyAgent"]

    agents:
      MallSupportAgent:
        stt:
          provider: "deepgram"
          language_code: "en"
          endpointing_ms: 100
        tts:
          model: "sonic-3"
          providers:
            arabic: "cartesia"
            english: "elevenlabs"
            mandarin: "inworld"
          voices:
            arabic: "6304c635-6681-4f9e-85b6-a97f4d26461a"  # Amira
            english: "H8bdWZHK2OgZwTN7ponr" # Need to use Saavi H8bdWZHK2OgZwTN7ponr  9626c31c-bec5-4cca-baa8-f8ba9e84c8bc
            mandarin: "Jing"   # Jing         
        language_switch:
          arabic:
            notice: "Sure, in that case let me transfer this call to someone who can assist you in Arabic."
            greeting: "مرحبًا! أنا أميرة من دعم عملاء دبي مول. كيف يمكنني مساعدتك اليوم؟"
          mandarin:
            notice: "Sure, in that case let me transfer this call to someone who can assist you in Chinese."
            greeting: "你好！我是晶晶，来自迪拜购物中心客户支持。请问我能帮您什么？"

      SurveyAgent:
        stt:
          provider: "deepgram"
          language_code: "en"
          endpointing_ms: 150
        tts:
          model: "sonic-3"
          providers:
            arabic: "elevenlabs"
            english: "inworld"
            mandarin: "inworld"
          voices:
            arabic: "4wf10lgibMnboGJGCLrP"   #  Arabic voice
            english: "Sarah" #  Sarah
            mandarin: "Xinyi"   #  Xinyi
        greeting:
          en: "Hello there! Hope Sarah helped you well! Could you please rate your experience of having conversation with her from one to five, where one is the lowest and five is the best?"
          ar: "مرحباً! نأمل أن سارة قدّمت لك المساعدة بشكل جيد. هل يمكنك تقييم تجربتك في التحدث معها من واحد إلى خمسة، حيث واحد هو الأدنى وخمسة هو الأفضل؟"
          zh: "你好！我希望 Sarah 对你有所帮助。请你为与她的对话体验打个分，从一到五评分，其中一分为最低，五分为最好。"
          # for Deepgram/ElevenLabs

