tenants:
  hsbc:
    company_name: "HSBC"
    greeting: "Hey there, I’m Eve, speaking from HSBC Talent Acquisition Team. How may I help you?"
    llm:
      model: "gpt-4.1"
      temperature: 0.1
    flows:
      default:
        enabled_agents: ["Applications", "Onboarding"]
    language:
      english:
        stt:
          provider: "deepgram"
          language_code: "en-US"
          endpointing_ms: 200
        tts:
          provider: "elevenlabs"
          model: "eleven_turbo_v2_5"
        accent:
          indian: "H8bdWZHK2OgZwTN7ponr"
          us: "xctasy8XvGp2cVO9HL9k"

  walmart:
    company_name: "Walmart"
    greeting: "Thank you for calling Walmart People Services, My name is Eve. How may I help you?"
    llm:
      model: "gpt-4.1"
      temperature: 0.1

    flows:
      default:
        enabled_agents: ["Applications", "Assessments", "Onboarding"]
      lite:
        enabled_agents: ["Assessments", "Onboarding"]
    language:
      english:
        stt:
          provider: "deepgram"
          language_code: "en-US"
          endpointing_ms: 200
        tts:
          provider: "elevenlabs"
          model: "eleven_turbo_v2_5"
        accent:
          indian: "H8bdWZHK2OgZwTN7ponr"
          us: "xctasy8XvGp2cVO9HL9k"

  translator:
    flows:
      hindi:
        target_voice: "H8bdWZHK2OgZwTN7ponr"
        placeholder: "Hindi"
        language_code: hi
        english_voice: "xctasy8XvGp2cVO9HL9k"            # for Deepgram/ElevenLabs

      spanish:
        target_voice: "tomkxGQGz4b1kE0EM722"
        placeholder: "Spanish"
        language_code: es 
        english_voice: "xctasy8XvGp2cVO9HL9k"   
  emaar:
    company_name: "Emaar (Dubai Mall)"
    greeting: "Hello, welcome to the Dubai Mall Customer Care, this is Sarah speaking. How may I help you today?"

    llm:
      model: "gpt-4.1"
      temperature: 0.1

    flows:
      default:
        enabled_agents: ["MallSupportAgent", "SurveyAgent"]

    agents:
      MallSupportAgent:
        stt:
          provider: "deepgram"
          language_code: "en"
          endpointing_ms: 100
        tts:
          provider: "elevenlabs"
          model: "eleven_turbo_v2_5"
          voices:
            english: "H8bdWZHK2OgZwTN7ponr"   # English - Indian accent
            arabic: "4wf10lgibMnboGJGCLrP"    # Arabic voice
            mandarin: "hkfHEbBvdQFNX4uWHqRF"  # Mandarin voice
        tts:
          model: "sonic-3"
          providers:
            arabic: "cartesia"
            english: "cartesia"
            mandarin: "inworld"
          voices:
            arabic: "6304c635-6681-4f9e-85b6-a97f4d26461a"  # Amira
            english: "9626c31c-bec5-4cca-baa8-f8ba9e84c8bc" # Jacqueline
            mandarin: "Jing"   # Jing 
        greeting: "Hello, this is Sarah from Dubai Mall Customer Support. How can I assist you today?"

      SurveyAgent:
        stt:
          provider: "deepgram"
          language_code: "en"
          endpointing_ms: 150
        tts:
          model: "sonic-3"
          providers:
            arabic: "cartesia"
            english: "inworld"
            mandarin: "inworld"
          voices:
            arabic: "6304c635-6681-4f9e-85b6-a97f4d26461a"  # Amira
            english: "Sarah" # Sarah
            mandarin: "Jing"   # Jing 
        greeting:   "Hello there! Hope Sarah helped you well! Could you please rate your experience of having conversation with her from one to five, where one is the lowest and five is the best?"

