tenants:
  hsbc:
    company_name: "HSBC"
    greeting: "Hey there, I'm Eve, speaking from HSBC Talent Acquisition Team. How may I help you?"
    llm:
      model: "gpt-4.1"
      temperature: 0.1
    flows:
      default:
        enabled_agents: ["Applications", "Onboarding"]
    language:
      english:
        stt:
          provider: "deepgram"
          language_code: "en-US"
          endpointing_ms: 200
        tts:
          provider: "elevenlabs"
          model: "eleven_turbo_v2_5"
        accent:
          indian: "H8bdWZHK2OgZwTN7ponr"
          us: "xctasy8XvGp2cVO9HL9k"
 
  walmart:
    company_name: "Walmart"
    greeting: "Thank you for calling Walmart People Services, My name is Eve. How may I help you?"
    llm:
      model: "gpt-4.1"
      temperature: 0.1

    flows:
      default:
        enabled_agents: ["Applications", "Assessments", "Onboarding"]
      lite:
        enabled_agents: ["Assessments", "Onboarding"]
    language:
      english:
        stt:
          provider: "deepgram"
          language_code: "en-US"
          endpointing_ms: 200
        tts:
          provider: "elevenlabs"
          model: "eleven_turbo_v2_5"
        accent:
          indian: "H8bdWZHK2OgZwTN7ponr"
          us: "xctasy8XvGp2cVO9HL9k"

  translator:
    flows:
      hindi:
        target_voice: "H8bdWZHK2OgZwTN7ponr"
        placeholder: "Hindi"
        language_code: hi
        english_voice: "xctasy8XvGp2cVO9HL9k"

      spanish:
        target_voice: "tomkxGQGz4b1kE0EM722"
        placeholder: "Spanish"
        language_code: es 
        english_voice: "xctasy8XvGp2cVO9HL9k"
  emaar:
    company_name: "Emaar (Dubai Mall)"
    greeting: "Hello! This is Sarah speaking from Dubai Mall Customer Support. Before we start, are you comfortable in English, or would you prefer speaking in Arabic?"

    llm:
      model: "gpt-4.1"
      temperature: 0.1

    flows:
      default:
        enabled_agents: ["MallSupportAgent", "SurveyAgent"]

    agents:
      MallSupportAgent:
        stt:
          provider: "speechmatics"
          language_code: "en"
          endpointing_ms: 100
        tts:
          model: "sonic-3"
          providers:
            arabic: "cartesia"
            english: "elevenlabs"
          voices:
            arabic: "6304c635-6681-4f9e-85b6-a97f4d26461a"  # Amira
            english: "H8bdWZHK2OgZwTN7ponr" # Need to use Saavi H8bdWZHK2OgZwTN7ponr  9626c31c-bec5-4cca-baa8-f8ba9e84c8bc        
        language_switch:
          arabic:
            notice: "Sure, in that case let me transfer this call to someone who can assist you in Arabic."
            greeting: "مرحبًا! أنا أميرة من دعم عملاء دبي مول. كيف يمكنني مساعدتك اليوم؟"

      SurveyAgent:
        stt:
          provider: "deepgram"
          language_code: "en"
          endpointing_ms: 150
        tts:
          model: "sonic-3"
          providers:
            arabic: "elevenlabs"
            english: "inworld"
          voices:
            arabic: "4wf10lgibMnboGJGCLrP"   #  Arabic voice
            english: "Sarah" #  Sarah
        greeting:
          en: "Hello there! Hope Sarah helped you well! Could you please rate your experience of having conversation with her from one to five, where one is the lowest and five is the best?"
          ar: "مرحباً! نأمل أن سارة قدّمت لك المساعدة بشكل جيد. هل يمكنك تقييم تجربتك في التحدث معها من واحد إلى خمسة، حيث واحد هو الأدنى وخمسة هو الأفضل؟"
          # for Deepgram/ElevenLabs